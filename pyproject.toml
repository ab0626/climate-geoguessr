[project]
name = "climate-geoguessr"
version = "0.1.0"
description = "Climate GeoGuessr + NOAA ISD data explorer"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
